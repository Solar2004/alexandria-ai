name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + Test + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('alexandria/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --manifest-path alexandria/Cargo.toml

      - name: Test
        run: cargo test --workspace --manifest-path alexandria/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --manifest-path alexandria/Cargo.toml -- -D warnings
