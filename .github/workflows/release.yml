name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            alexandria/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('alexandria/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --manifest-path alexandria/Cargo.toml

      - name: Package binary
        run: |
          cp alexandria/target/release/alx ./alx 2>/dev/null || cp alexandria/target/release/alx-cli ./alx 2>/dev/null || echo "binary not found, listing:" && ls -la alexandria/target/release/ | head -20
          chmod +x ./alx 2>/dev/null || true
          ls -lh ./alx 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./alx
          generate_release_notes: true
          fail_on_unmatched_files: false
