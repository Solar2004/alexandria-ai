[workspace]
resolver = "2"
members = [
  "crates/alx-core",
  "crates/alx-hooks",
  "crates/alx-memory",
  "crates/alx-governor",
  "crates/alx-task",
  "crates/alx-harness",
  "crates/alx-gate",
  "crates/alx-bench",
  "crates/alx-critic",
  "crates/alx-audit",
  "crates/alx-night",
  "crates/alx-mcp",
  "crates/alx-agents",
  "crates/alx-cli",
  "crates/alx-evolve",
  "crates/alx-lib",
  "crates/alx-tui",
