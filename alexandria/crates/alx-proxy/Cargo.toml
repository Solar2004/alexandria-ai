[package]
name = "alx-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync"] }
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
futures-util = "0.3"
alx-core = { path = "../alx-core" }
alx-governor = { path = "../alx-governor" }

[[bin]]
name = "alx-proxy"
path = "src/main.rs"

[dev-dependencies]
