<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="460" viewBox="0 0 1240 460">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </radialGradient>
    <linearGradient id="pgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2336"/>
      <stop offset="100%" stop-color="#141b2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d78e"/>
      <stop offset="100%" stop-color="#e8b64c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#26314b" stroke-width="0.4" opacity="0.35"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#e8b64c"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#3ddc84"/>
    </marker>
  </defs>
  <rect width="1240" height="460" fill="url(#bgGlow)"/>
  <rect width="1240" height="460" fill="url(#grid)"/>
  <text x="300" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#eceff7" letter-spacing="1">Ciclo R24</text>
  <text x="300" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#8a94ab" letter-spacing="3">VERIFICA → CRITICA → MEJORA · itera solo</text>

  <!-- anillo del ciclo -->
  <path d="M348.0 166.9 A96 96 0 0 1 373.5 311.7" stroke="#3ddc84" stroke-width="30" fill="none" stroke-linecap="butt" opacity="0.92"/>
  <text x="423" y="228" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#3ddc84">VERIFICA</text>
  <path d="M361.7 323.5 A96 96 0 0 1 216.9 298.0" stroke="#4a9eff" stroke-width="30" fill="none" stroke-linecap="butt" opacity="0.92"/>
  <text x="278" y="373" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#4a9eff">CRITICA</text>
  <path d="M209.8 282.8 A96 96 0 0 1 283.3 155.5" stroke="#e0526e" stroke-width="30" fill="none" stroke-linecap="butt" opacity="0.92"/>
  <text x="192" y="188" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#e0526e">MEJORA</text>
  <path d="M300.0 154.0 A96 96 0 0 1 332.8 159.8" stroke="#e8b64c" stroke-width="30" fill="none" stroke-linecap="butt" opacity="0.92"/>
  <text x="300" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#eceff7">unidad</text>
  <text x="300" y="276" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#8a94ab">iter+1 auto</text>
  <text x="300" y="404" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#e8b64c">state.toml por sesión · auto-iterate en cada commit</text>

  <!-- flujo del agente autónomo (10 pasos) -->
  <text x="880" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#eceff7" letter-spacing="1">Arranque autónomo</text>
  <text x="880" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#8a94ab" letter-spacing="3">atg --dangerously-skip-permissions</text>
  <g>
    <rect x="700" y="96" width="360" height="28" rx="7" fill="#0b0f1a" stroke="#26314b" stroke-width="1"/>
  <text x="880.0" y="112" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">1·2 PLAN → TASK + MEMORIA</text>
  <text x="880.0" y="119" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#e8b64c">alx task add · memory.recall</text>
    <rect x="700" y="132" width="360" height="28" rx="7" fill="#0b0f1a" stroke="#26314b" stroke-width="1"/>
  <text x="880.0" y="148" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">3·4 AGENTE → SKILLS</text>
  <text x="880.0" y="155" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#4a9eff">agent-dispatch sugiere · skills-fetch si falta</text>
    <rect x="700" y="168" width="360" height="28" rx="7" fill="#0b0f1a" stroke="#26314b" stroke-width="1"/>
  <text x="880.0" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">5·6 PLUGINS → SUBAGENTES</text>
  <text x="880.0" y="191" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#3ddc84">Task en paralelo si es grande</text>
    <rect x="700" y="204" width="360" height="28" rx="7" fill="#0b0f1a" stroke="#26314b" stroke-width="1"/>
  <text x="880.0" y="220" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">7·8 HARNESS → MCP</text>
  <text x="880.0" y="227" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#e0526e">harness-new (⚡ hot reload) · phalanx.status</text>
    <rect x="700" y="240" width="360" height="28" rx="7" fill="#0b0f1a" stroke="#26314b" stroke-width="1"/>
  <text x="880.0" y="256" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">9·10 EVOLVE → VERIFICA-CRITICA-MEJORA</text>
  <text x="880.0" y="263" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#e8b64c">harness permanente si hay evidencia · commit</text>
  </g>
  <path d="M700 110 C 660 110, 640 130, 610 160" stroke="#e8b64c" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" opacity="0.7"/>
  <text x="640" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#8a94ab">cada unidad cicla R24</text>
  <text x="880" y="300" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#3ddc84">harnesses temporales por sesión/proyecto · se retiran solos al cumplir objetivo</text>

  <!-- banda inferior: guardas -->
  <rect x="70" y="330" width="1100" height="96" rx="14" fill="url(#pgrad)" stroke="#26314b" stroke-width="1"/>
  <rect x="70" y="330" width="1100" height="3" rx="1.5" fill="#e8b64c" opacity="0.9"/>
  <text x="88" y="360" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#eceff7">Guardas que lo OBLIGAN (deterministas, fuera del LLM)</text>
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#eceff7">
    <text x="95" y="376">system-usage-guard</text><text x="95" y="394" fill="#8a94ab" font-size="9">tasks + MCP obligatorios con iter&gt;0</text>
    <text x="370" y="376">research-guard</text><text x="370" y="394" fill="#8a94ab" font-size="9">no cierra research a medias</text>
    <text x="560" y="376">skill-guard</text><text x="560" y="394" fill="#8a94ab" font-size="9">los pasos de la skill se ejecutan</text>
    <text x="770" y="376">gate-verify</text><text x="770" y="394" fill="#8a94ab" font-size="9">build real o no pasa</text>
    <text x="950" y="376">LSP</text><text x="950" y="394" fill="#8a94ab" font-size="9">diagnostics como evidencia</text>
  </g>
</svg>
