<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#141923"/>
  <text x="360" y="38" fill="#fff" font-size="21" text-anchor="middle" font-family="sans-serif" font-weight="bold">ALEXANDRIA harness vs direct AI</text>
  <text x="360" y="60" fill="#8892a6" font-size="13" text-anchor="middle" font-family="sans-serif">% pass@1 · real benchmarks (execution-verified) · deepseek-v4-flash chain</text>
  <!-- axes -->
  <line x1="80" y1="80" x2="80" y2="320" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="320" x2="660" y2="320" stroke="#555" stroke-width="2"/>
  <!-- gridlines 0/25/50/75/100 -->
  <g fill="#667" font-size="11" font-family="sans-serif">
    <text x="68" y="324">0</text>
    <text x="62" y="244">25</text><line x1="80" y1="240" x2="660" y2="240" stroke="#2a3242" stroke-dasharray="4,4"/>
    <text x="62" y="164">50</text><line x1="80" y1="160" x2="660" y2="160" stroke="#2a3242" stroke-dasharray="4,4"/>
    <text x="62" y="84">75</text><line x1="80" y1="80" x2="660" y2="80" stroke="#2a3242" stroke-dasharray="4,4"/>
  </g>
  <!-- BigCodeBench N=20 (ciclo 10, 2026-08-25): direct 15% (y=272) harness 45% (y=160) -->
  <rect x="120" y="272" width="75" height="48" fill="#e05252" rx="3"/>
  <rect x="215" y="160" width="75" height="160" fill="#2ecc71" rx="3"/>
  <text x="157" y="262" fill="#e05252" font-size="13" text-anchor="middle" font-family="sans-serif" font-weight="bold">15%</text>
  <text x="252" y="150" fill="#2ecc71" font-size="13" text-anchor="middle" font-family="sans-serif" font-weight="bold">45%</text>
  <text x="205" y="345" fill="#cfd6e4" font-size="12.5" text-anchor="middle" font-family="sans-serif">BigCodeBench N=20 · 3.0x</text>
  <!-- Held-out N=30: direct 7% (y=296) harness 73% (y=88) -->
  <rect x="370" y="296" width="75" height="24" fill="#e05252" rx="3"/>
  <rect x="465" y="88" width="75" height="232" fill="#2ecc71" rx="3"/>
  <text x="407" y="286" fill="#e05252" font-size="13" text-anchor="middle" font-family="sans-serif" font-weight="bold">7%</text>
  <text x="502" y="78" fill="#2ecc71" font-size="13" text-anchor="middle" font-family="sans-serif" font-weight="bold">73%</text>
  <text x="455" y="345" fill="#cfd6e4" font-size="12.5" text-anchor="middle" font-family="sans-serif">Held-out N=30 · 11x</text>
  <!-- HumanEval N=164: direct 90% (y=36) harness 95% (y=20) -->
  <rect x="600" y="36" width="40" height="284" fill="#e05252" rx="3"/>
  <rect x="645" y="20" width="40" height="300" fill="#2ecc71" rx="3"/>
  <text x="620" y="30" fill="#e05252" font-size="11" text-anchor="middle" font-family="sans-serif">90%</text>
  <text x="665" y="14" fill="#2ecc71" font-size="11" text-anchor="middle" font-family="sans-serif">95%</text>
  <text x="643" y="345" fill="#cfd6e4" font-size="12.5" text-anchor="middle" font-family="sans-serif">HumanEval N=164</text>
  <!-- legend -->
  <rect x="200" y="368" width="14" height="14" fill="#e05252" rx="2"/><text x="220" y="380" fill="#cfd6e4" font-size="13" font-family="sans-serif">Direct AI (no harness)</text>
  <rect x="380" y="368" width="14" height="14" fill="#2ecc71" rx="2"/><text x="400" y="380" fill="#cfd6e4" font-size="13" font-family="sans-serif">ALEXANDRIA harness</text>
</svg>