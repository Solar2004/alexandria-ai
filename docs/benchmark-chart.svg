<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#1c1c1c"/>
  <text x="360" y="40" fill="#fff" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">ALEXANDRIA harness vs direct AI</text>
  <text x="360" y="62" fill="#888" font-size="13" text-anchor="middle" font-family="sans-serif">% pass@1 · real benchmarks (execution-verified)</text>
  <!-- axes -->
  <line x1="80" y1="80" x2="80" y2="320" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="320" x2="660" y2="320" stroke="#555" stroke-width="2"/>
  <!-- gridlines 0/25/50/75/100 -->
  <g fill="#666" font-size="11" font-family="sans-serif">
    <text x="68" y="324">0</text><line x1="80" y1="320" x2="660" y2="320" stroke="#333"/>
    <text x="62" y="244">25</text><line x1="80" y1="240" x2="660" y2="240" stroke="#333" stroke-dasharray="4,4"/>
    <text x="62" y="164">50</text><line x1="80" y1="160" x2="660" y2="160" stroke="#333" stroke-dasharray="4,4"/>
    <text x="62" y="84">75</text><line x1="80" y1="80" x2="660" y2="80" stroke="#333" stroke-dasharray="4,4"/>
  </g>
  <!-- BigCodeBench: direct 11% (y=288) harness 67% (y=152) -->
  <rect x="150" y="288" width="70" height="32" fill="#e05252" rx="3"/>
  <rect x="240" y="152" width="70" height="168" fill="#2ecc71" rx="3"/>
  <text x="185" y="278" fill="#e05252" font-size="12" text-anchor="middle" font-family="sans-serif">11%</text>
  <text x="275" y="142" fill="#2ecc71" font-size="12" text-anchor="middle" font-family="sans-serif">67%</text>
  <text x="230" y="345" fill="#ccc" font-size="13" text-anchor="middle" font-family="sans-serif">BigCodeBench (186)</text>
  <!-- Held-out: direct 7% (y=298) harness 73% (y=120) -->
  <rect x="380" y="298" width="70" height="22" fill="#e05252" rx="3"/>
  <rect x="470" y="120" width="70" height="200" fill="#2ecc71" rx="3"/>
  <text x="415" y="288" fill="#e05252" font-size="12" text-anchor="middle" font-family="sans-serif">7%</text>
  <text x="505" y="110" fill="#2ecc71" font-size="12" text-anchor="middle" font-family="sans-serif">73%</text>
  <text x="460" y="345" fill="#ccc" font-size="13" text-anchor="middle" font-family="sans-serif">Held-out (30)</text>
  <!-- HumanEval: direct 90% (y=36) harness 95% (y=20) -->
  <rect x="575" y="36" width="40" height="284" fill="#e05252" rx="3"/>
  <rect x="620" y="20" width="40" height="300" fill="#2ecc71" rx="3"/>
  <text x="595" y="30" fill="#e05252" font-size="11" text-anchor="middle" font-family="sans-serif">90%</text>
  <text x="640" y="14" fill="#2ecc71" font-size="11" text-anchor="middle" font-family="sans-serif">95%</text>
  <text x="617" y="345" fill="#ccc" font-size="13" text-anchor="middle" font-family="sans-serif">HumanEval (164)</text>
  <!-- legend -->
  <rect x="200" y="368" width="14" height="14" fill="#e05252" rx="2"/><text x="220" y="380" fill="#ccc" font-size="13" font-family="sans-serif">Direct AI (no harness)</text>
  <rect x="380" y="368" width="14" height="14" fill="#2ecc71" rx="2"/><text x="400" y="380" fill="#ccc" font-size="13" font-family="sans-serif">ALEXANDRIA harness</text>
</svg>
