# Doc-min: cada archivo nuevo o editado lleva documentación mínima (doc-min).
# Conectado: `alx hook post-tool-use` lo ejecuta; `alx docmin <file>` es real
# (exit 1 si el fichero no tiene comentario mínimo — el dispatcher lo registra).
id = "docmin.verify"
event = "ToolPost"
priority = "Post"
command = 'test -n "${ALX_FILE:-}" && alx docmin "${ALX_FILE}"; true'
timeout_ms = 5000
lock = false
retry = 1
enabled = true
description = "Verifica la regla doc-min tras Ediciones y Escrituras: todo archivo nuevo o cambiado debe documentar qué resuelve."
