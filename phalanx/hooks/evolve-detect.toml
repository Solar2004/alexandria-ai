# Doc-min: detecta patrones repetidos para convertirlos en harnesses.
# Conectado: `alx hook post-tool-use` lo ejecuta; `alx evolve-detect` es real
# (historial en state/harness-candidates.log; ≥2 repeticiones → candidato).
id = "evolve.detect"
event = "ToolPost"
priority = "Async"
command = "alx evolve-detect"
timeout_ms = 8000
lock = false
retry = 1
enabled = true
description = "Detecta operaciones repetidas o exitosas candidatas a convertirse en un harness evolutivo reutilizable."
