# Doc-min: compuerta de evidencia — sin pruebas reales, la fase no pasa.
id = "gate.verify"
event = "PhasePassed"
priority = "Pre"
command = "alx-gate verify --phase ${PHASE} --policy strict --evidence required --sandbox"
timeout_ms = 10000
lock = true
retry = 1
enabled = true
description = "Exige evidencia real del trabajo de la fase (output de comando, tests); con política strict, sin evidencia la fase no pasa."
