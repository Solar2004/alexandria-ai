# Doc-min: controla el coste clasificando la dificultad antes de actuar.
# Conectado: `alx hook pre-tool-use` lo ejecuta; `alx classify` es real
# (alx-governor::classify_prompt_text → tier; deja marca en state/last-tier.txt).
id = "governor.classify"
event = "ToolPre"
priority = "Pre"
command = "alx classify"
timeout_ms = 2000
lock = false
retry = 1
enabled = true
description = "Clasifica la dificultad de la operación y selecciona el tier de modelo y la ruta de red correspondiente."
