# Doc-min: micro-tareas listas se ejecutan en sesiones headless, en paralelo.
# Conectado: `alx agents-run <task>` es real (3 agentes en paralelo, ciclo 2).
# Evento interno del bus (MicroTaskReady): lo dispara el motor, no Claude Code.
id = "headless.spawn"
event = "MicroTaskReady"
priority = "Async"
command = "alx agents-run ${ALX_TASK_ID}"
timeout_ms = 10000
lock = false
retry = 2
enabled = true
description = "Lanza sesiones headless para micro-tareas listas, en paralelo, sin bloquear la sesión principal del usuario."
