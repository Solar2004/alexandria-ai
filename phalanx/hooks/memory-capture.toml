# Doc-min: el auto-recordarse — captura aprendizaje para no repetirlo.
# Conectado: `alx hook post-tool-use` lo ejecuta; `alx memory-capture` es real
# (comprime caveman + persiste en state/recalls.json, legible por MCP memory.recall).
id = "memory.capture"
event = "ToolPost"
priority = "Post"
command = "alx memory-capture"
timeout_ms = 5000
lock = false
retry = 2
enabled = true
description = "Si la tool dejó aprendizaje (error, fix, patrón), lo comprime a una frase caveman y lo guarda como Recall."
