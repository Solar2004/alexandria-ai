# Doc-min: re-inyecta la memoria maestra y las reglas globales en cada prompt.
# Conectado: `alx hook user-prompt-submit` lo ejecuta; `alx mission` es real.
id = "phalanx.mission"
event = "UserPromptSubmit"
priority = "Pre"
command = "alx mission"
timeout_ms = 3000
lock = true
retry = 1
enabled = true
description = "Re-inyecta la memoria maestra MISSION.md y las reglas de calidad (caveman, evidencia) en cada prompt del usuario via `alx hook user-prompt-submit`."
