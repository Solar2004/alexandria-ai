[package]
name = "alx-cli"
version.workspace = true
edition.workspace = true
description = "Binario alx: subcomandos, TUI estado, merge atg"

[[bin]]
name = "alx"
path = "src/main.rs"

[dependencies]
alx-core = { path = "../alx-core" }
alx-lib = { path = "../alx-lib" }
alx-task = { path = "../alx-task" }
alx-harness = { path = "../alx-harness" }
alx-gate = { path = "../alx-gate" }
alx-critic = { path = "../alx-critic" }
alx-governor = { path = "../alx-governor" }
alx-agents = { path = "../alx-agents" }
alx-audit = { path = "../alx-audit" }
alx-evolve = { path = "../alx-evolve" }
alx-mcp = { path = "../alx-mcp" }
alx-memory = { path = "../alx-memory" }
alx-night = { path = "../alx-night" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
