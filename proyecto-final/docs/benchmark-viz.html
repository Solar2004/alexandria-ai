<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEXANDRIA · Benchmark Viz</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #111; color: #eee; }
  h1 { font-size: 1.2em; color: #fff; margin: 0 0 4px; }
  .sub { color: #888; font-size: .8em; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 16px; }
  .card h2 { font-size: .95em; margin: 0 0 10px; color: #ccc; font-weight: 600; }
  canvas { max-height: 300px; }
</style>
</head>
<body>
<h1>📊 ALEXANDRIA · Benchmark Viz</h1>
<div class="sub">BigCodeBench (ICLR'25) + HumanEval · mismo modelo deepseek-v4-flash · plan-then-code</div>

<div class="grid">
  <div class="card">
    <h2>Directa vs Harness · % acierto por set</h2>
    <canvas id="c1"></canvas>
  </div>
  <div class="card">
    <h2>Ventaja del harness (ratio)</h2>
    <canvas id="c2"></canvas>
  </div>
  <div class="card">
    <h2>Mecanismos del harness (aciertos /60)</h2>
    <canvas id="c3"></canvas>
  </div>
  <div class="card">
    <h2>Problemas recuperados por set</h2>
    <canvas id="c4"></canvas>
  </div>
  <div class="card">
    <h2>Líneas comparativas · Directa vs Harness</h2>
    <canvas id="c5"></canvas>
  </div>
</div>

<script>
const DARK = '#eee';
Chart.defaults.color = DARK;
Chart.defaults.borderColor = '#333';
Chart.defaults.font.size = 12;

// 1 · Directa vs Harness por set (porcentajes, 3 familias)
new Chart(document.getElementById('c1'), {
  type: 'bar',
  data: {
    labels: ['BigCodeBench (186)', 'Held-out (30)', 'HumanEval (164)', 'CodeContests (30)'],
    datasets: [
      { label: 'Directa (sin harness)', data: [11, 7, 89.6, 40], backgroundColor: '#e05252' },
      { label: 'Harness ALEXANDRIA', data: [63, 73, 95.1, 40], backgroundColor: '#2ecc71' }
    ]
  },
  options: { responsive: true, scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: '% acierto' } } }, plugins: { legend: { position: 'bottom' } } }
});

// 2 · Ratio harness/directa por set
new Chart(document.getElementById('c2'), {
  type: 'bar',
  data: {
    labels: ['Held-out (30)', 'BigCodeBench (186)', 'HumanEval (164)', 'CodeContests (30)'],
    datasets: [{ label: 'Ratio', data: [11.0, 5.57, 1.06, 1.0], backgroundColor: ['#f39c12', '#2ecc71', '#3498db', '#e05252'] }]
  },
  options: { responsive: true, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.parsed.y}x` } } }, scales: { y: { title: { display: true, text: 'x veces' } } } }
});

// 3 · Mecanismos del harness
new Chart(document.getElementById('c3'), {
  type: 'bar',
  data: {
    labels: ['Plan-then-code', 'Feedback simple', 'Ensamble', 'Feedback rich'],
    datasets: [{ label: 'Aciertos (de 60)', data: [43, 34, 33, 29], backgroundColor: ['#2ecc71', '#3498db', '#f39c12', '#e05252'] }]
  },
  options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
});

// 4 · Recuperados (directa ✗ → harness ✓) por set
new Chart(document.getElementById('c4'), {
  type: 'bar',
  data: {
    labels: ['BigCodeBench (186)', 'Held-out (30)', 'HumanEval (164)', 'CodeContests (30)'],
    datasets: [{ label: 'Recuperados', data: [96, 20, 9, 0], backgroundColor: '#e67e22' }]
  },
  options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, title: { display: true, text: 'problemas' } } } }
});

// 5 · Líneas comparativas directa vs harness (3 familias)
new Chart(document.getElementById('c5'), {
  type: 'line',
  data: {
    labels: ['BigCodeBench (186)', 'Held-out (30)', 'HumanEval (164)', 'CodeContests (30)'],
    datasets: [
      { label: 'Directa', data: [11, 7, 89.6, 40], borderColor: '#e05252', backgroundColor: 'transparent', tension: 0.3, pointRadius: 5 },
      { label: 'Harness', data: [63, 73, 95.1, 40], borderColor: '#2ecc71', backgroundColor: 'transparent', tension: 0.3, pointRadius: 5, borderWidth: 3 }
    ]
  },
  options: { responsive: true, scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: '% acierto' } } }, plugins: { legend: { position: 'bottom' } } }
});
</script>
</body>
</html>
