# Doc-min: métricas de cada operación para el informe y los umbrales.
id = "bench.sample"
event = "PostToolUse"
priority = "Async"
command = "alx-bench sample --metric time,tokens,exit --phase ${PHASE}"
timeout_ms = 3000
lock = false
retry = 2
enabled = true
description = "Mide las métricas de la operación (tiempo, tokens, éxito) para el informe nocturno y los umbrales de performance."
