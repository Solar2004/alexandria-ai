# Doc-min: crítica de calidad sobre el output antes de avanzar de fase.
id = "critic.run"
event = "PhasePassed"
priority = "Pre"
command = "alx-critic run --phase ${PHASE} --max-iterations 3 --escalate-after 2"
timeout_ms = 15000
lock = false
retry = 1
enabled = true
description = "Corre el crítico sobre el output de la fase recién aprobada; si falla, escala tras las rondas configuradas."
